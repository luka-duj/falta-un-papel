name: Comunicar un error
description: Informa de un enlace roto, un campo incorrecto o cualquier error reproducible.
body:
  - type: markdown
    attributes:
      value: Este reporte será público. Usa datos ficticios y omite documentos reales, credenciales y conversaciones privadas.
  - type: input
    id: entorno
    attributes:
      label: Cliente y versión del complemento
      placeholder: Codex, Falta un papel 0.2.0-alpha.2
    validations:
      required: true
  - type: input
    id: ficha
    attributes:
      label: Municipio, trámite y enlace público a la ficha oficial
  - type: textarea
    id: resultado
    attributes:
      label: Pasos, resultado y qué esperabas que ocurriera
      description: Usa un caso inventado fácil de repetir.
    validations:
      required: true
